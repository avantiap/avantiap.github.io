<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Session Logger Test Page</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 0; 
      padding: 0;
      position: relative;
    }
    
    /* Fixed coordinates using absolute positioning */
    .google-link {
      position: absolute;
      top: 50px;
      left: 100px;
    }
    
    #spa {
      position: absolute;
      top: 100px;
      left: 50px;
      width: 400px;
    }
    
    #spa nav a {
      position: absolute;
      cursor: pointer;
      color: blue;
      text-decoration: underline;
    }
    
    #spa nav a[data-target="home"] {
      top: 30px;
      left: 0px;
    }
    
    #spa nav a[data-target="dashboard"] {
      top: 30px;
      left: 60px;
    }
    
    #spa nav a[data-target="settings"] {
      top: 30px;
      left: 150px;
    }
    
    #spa-content {
      position: absolute;
      top: 60px;
      left: 0px;
      border: 1px solid #ccc;
      padding: 1em;
      width: 300px;
      height: 100px;
    }
  </style>
</head>
<body>
  <h1 style="position: absolute; top: 10px; left: 50px;">Session Logger Test Page</h1>

  <a href="https://www.google.com" target="_blank" class="google-link">Click here</a>

  <section id="spa">
    <h2 style="position: absolute; top: 0px; left: 0px;">SPA section</h2>
    <nav>
      <a data-target="home">Home</a>
      <a data-target="dashboard">Dashboard</a>
      <a data-target="settings">Settings</a>
    </nav>
    <div id="spa-content">Home Content</div>
  </section>

  <script>
    // SPA navigation (same as before)
    const spaContent = document.getElementById('spa-content');
    document.querySelectorAll('#spa nav a').forEach(el => {
      el.addEventListener('click', () => {
        const target = el.getAttribute('data-target');
        spaContent.innerText = target.charAt(0).toUpperCase() + target.slice(1) + ' Content';
        console.log(`SPA navigation: ${target}`);
      });
    });
  </script>
</body>
</html>
