<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Logger Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        ol {
            padding-left: 20px;
        }
        li {
            margin-bottom: 10px;
        }
        a {
            color: #2980b9;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        a:hover {
            color: #3498db;
            text-decoration: underline;
        }
        .external::after {
            content: " (External Site)";
            font-size: 0.8em;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
  <a href="https://www.google.com" target="_blank" class="google-link">Click here</a>

  <section id="spa">
    <ol>
    <h2 style="position: absolute; top: 0px; left: 0px;">SPA section</h2>
    <nav>
      <a data-target="home">Home</a>
      <a data-target="dashboard">Dashboard</a>
      <a data-target="settings">Settings</a>
    </nav>
    <div id="spa-content">Home Content</div>
    </ol>
  </section>

  <script>
    // SPA navigation (same as before)
    const spaContent = document.getElementById('spa-content');
    document.querySelectorAll('#spa nav a').forEach(el => {
      el.addEventListener('click', () => {
        const target = el.getAttribute('data-target');
        spaContent.innerText = target.charAt(0).toUpperCase() + target.slice(1) + ' Content';
        console.log(`SPA navigation: ${target}`);
      });
    });
  </script>
</body>
</html>
