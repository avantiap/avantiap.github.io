<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Logger Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        a {
            color: #2980b9;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        a:hover {
            color: #3498db;
            text-decoration: underline;
        }
        .external::after {
            content: " (External Site)";
            font-size: 0.8em;
            color: #7f8c8d;
        }
        .text-field {
            margin-top: 20px;
        }
        .text-field label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .text-field textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }
        .text-field textarea:focus {
            outline: none;
            border-color: #3498db;
        }
    </style>
</head>
<body>
    <h1> SESSION LOGGER TEST PAGE </h1>
  <a href="https://www.google.com" target="_blank" class="google-link" data-cy="new-tab-link-google">Click here</a>
    <div class="text-field">
        <label for="pasteText">Paste your text here:</label>
        <textarea id="pasteText" name="pasteText" placeholder="Paste or type your text here..."></textarea>
    </div>
</body>
</html>
